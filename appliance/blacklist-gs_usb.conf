# Keep the kernel's gs_usb driver away from the CAN adapter.
# Installed by install_service.sh to /etc/modprobe.d/casper-blacklist-gs_usb.conf
#
# WHY: this appliance talks to the dongle through libusb (python-gs_usb), not
# through SocketCAN. The kernel module wants the same device, and the two fight:
# libusb detaches the kernel driver to claim the interface, the kernel re-binds it
# when the handle closes, and every reopen resets the device again. dmesg showed the
# loop plainly, once per recovery attempt:
#
#   usb 1-1: reset full-speed USB device number 2 using xhci-hcd
#   gs_usb 1-1:1.0: Configuring for 1 interfaces
#
# Symptom from the outside: polls fail while the adapter is present and the process
# is healthy - "car not answering" with a climbing poll-error count, exactly what the
# app reported mid-drive with the ignition on.
#
# Blacklisting gives libusb exclusive ownership. Nothing here uses the SocketCAN
# interface, so nothing is lost; if a future tool wants `can0`, it must remove this
# file and stop using python-gs_usb.
blacklist gs_usb
