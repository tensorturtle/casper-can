# systemd drop-in for bluetooth.service. Installed by install_service.sh to
# /etc/systemd/system/bluetooth.service.d/casper.conf
#
# WHY: bluetoothd does not only serve our GATT database - it also acts as a GATT
# *client* against whatever connects to it, because several built-in plugins want
# services from the peer. Against an iPhone that backfires:
#
#   > ATT Error Response: Read Request, Handle 0x0025
#         Error: Insufficient Authentication (0x05)
#   < SMP: Security Request
#         Authentication requirement: Bonding, MITM, SC
#
# iOS gates attributes like Battery Level behind pairing. BlueZ reads one, is
# refused, and immediately requests bonding so it can retry - which is what put a
# pairing dialog on the phone. With pairing now disabled the request is rejected
# and the loop simply repeats, measured at 56 failed exchanges in eight minutes,
# roughly one per second, on a radio this board already shares with Wi-Fi.
#
# Disabling the plugins that reach for peer services removes the trigger at source.
# None of them matter to this appliance: it is a peripheral serving telemetry, and
# it wants nothing at all from the phone.
#
#   battery    - reads the peer's Battery Service (the attribute iOS refuses)
#   scanparam  - client of the peer's Scan Parameters service
#   autopair   - initiates pairing on its own initiative
#
# Verify with `btmon` after applying: "Security Request" should not appear at all.

[Service]
# Empty ExecStart clears the unit's own value before setting ours; systemd
# otherwise appends and refuses to start with two ExecStart lines.
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=battery,scanparam,autopair
